<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>facebook</title>
</head>
<body class="bg-gray-200">
    <div class="flex justify-center w-screen h-screen items-center justify-items-center flex-col md:flex-row">
        <div class="p-10 text-center md:text-left"> 
            <h1 class="text-blue-500 font-bold text-5xl">
                facebook    
            </h1>
            <h2 class="font-bold text-2xl w-96">
                Facebook helps you connect and share with the people in your life.
            </h2>
        </div>
            <div class="bg-white flex justify-center items-center flex-col rounded-md shadow-lg w-80 p-5 mt-4">
               <input class="border-gray-300 rounded-sm border w-full h-11 mb-5 pl-2" type="text" placeholder="Email or Number">
               <input class="border-gray-300 rounded-sm border w-full h-11 mb-5 pl-2" type="text" placeholder="Password">
               <button class="bg-blue-500 w-36 text-white rounded w-80 m-3 h-10 hover:bg-blue-600">Enter</button>
               <p>
                <span class="text-blue-400 cursor-pointer hover:text-blue-500 underline mt-3">Forgot password?</span>
                </p>
                <hr class="w-full m-4">
               <button class="bg-green-400 hover:bg-green-500 text-white rounded p-2 bg-green-600 mt-3">Create new account</button>
            </div>
    </div>
</body>
</html>
